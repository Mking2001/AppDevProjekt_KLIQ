# ============================================================
# KLIQ Queries — Firebase Data Connect
# ============================================================

# ===== USER Queries =====
query GetUserById($id: String!) @auth(level: PUBLIC) {
  user(id: $id) {
    id
    username
    email
    firstName
    lastName
    birthDateMs
    age
    gender
    hometown
    countryCode
    phoneNumber
    profilePictureUrl
    bio
    password
    updatedAt
  }
}

query ListUsers @auth(level: PUBLIC) {
  users {
    id
    username
    email
    phoneNumber
    firstName
    lastName
    profilePictureUrl
    gender
    hometown
    password
  }
}

query CheckUsername($username: String!) @auth(level: PUBLIC) {
  users(where: { username: { eq: $username } }) {
    id
    username
    email
    phoneNumber
    password
  }
}

query GetUserPhotos($userId: String!) @auth(level: PUBLIC) {
  userPhotos(
    where: { userId: { eq: $userId } }
    orderBy: [{ displayOrder: ASC }]
  ) {
    id
    userId
    imageUrl
    displayOrder
    createdAt
  }
}

query GetUserPreferences($userId: String!) @auth(level: PUBLIC) {
  userPreferences(where: { userId: { eq: $userId } }) {
    userId
    isDarkMode
    searchRadiusKm
    pushNotificationsEnabled
    searchIntent
    smokingHabit
    drinkingHabit
  }
}

# ===== FEED POST Queries =====
query GetFeedPosts @auth(level: PUBLIC) {
  feedPosts(orderBy: [{ createdAtMs: DESC }]) {
    id
    authorUserId
    authorName
    authorAvatarUrl
    contentText
    imageUrl
    clubId
    clubName
    locationName
    locationAddress
    latitude
    longitude
    isEventPinned
    isFollowersOnly
    likeCount
    commentCount
    flameCount
    flameDate
    createdAtMs
  }
}

query GetFeedComments($postId: String!) @auth(level: PUBLIC) {
  feedComments(
    where: { postId: { eq: $postId } }
    orderBy: [{ createdAtMs: ASC }]
  ) {
    id
    postId
    authorUserId
    authorName
    text
    createdAtMs
  }
}

query GetFeedPostLikes($postId: String!) @auth(level: PUBLIC) {
  feedPostLikes(where: { postId: { eq: $postId } }) {
    postId
    userId
    createdAtMs
  }
}

# ===== STORY Queries =====
query GetActiveStories @auth(level: PUBLIC) {
  stories(orderBy: [{ createdAtMs: DESC }]) {
    id
    authorUserId
    authorName
    avatarUrl
    imageUrl
    headline
    clubName
    createdAtMs
  }
}


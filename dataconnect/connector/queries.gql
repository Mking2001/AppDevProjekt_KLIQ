query GetReviewsForTargetUser($targetUserId: String!) @auth(level: PUBLIC) {
  reviews(where: { targetUserId: { eq: $targetUserId } }) {
    id
    reviewerUserId
    reviewerUsername
    rating
    text
    timestamp
  }
}

# ===== CHAT Queries =====
query GetAllChats @auth(level: PUBLIC) {
  chats {
    id
    name
    chatType
    cityRegion
    lastMessageText
    lastMessageTimestampMs
    lastMessageTimestampIso
    avatarInitial
    avatarUrl
    unreadCount
    isOnline
    isPinned
    isMuted
    isArchived
  }
}

query GetMessagesByChat($chatId: String!) @auth(level: PUBLIC) {
  messages(
    where: { chat: { id: { eq: $chatId } } }
    orderBy: [{ timestampMs: ASC }]
  ) {
    id
    senderUserId
    senderName
    text
    timestampMs
    timestampIso
    mediaUrl
    messageType
    thumbnailUrl
    caption
    audioDurationMs
    status
    deliveredAtMs
    readAtMs
    isMine
    replyToMessageId
    isEdited
  }
}

# ===== DIRECT MESSAGE Queries =====
query GetDirectMessages($senderId: String!, $receiverId: String!) @auth(level: PUBLIC) {
  directMessages(
    where: {
      _or: [
        { senderId: { eq: $senderId }, receiverId: { eq: $receiverId } }
        { senderId: { eq: $receiverId }, receiverId: { eq: $senderId } }
      ]
    }
    orderBy: [{ timestamp: ASC }]
  ) {
    id
    senderId
    receiverId
    text
    timestamp
    deliveryStatus
    mediaUrl
    messageType
    caption
    audioDurationMs
  }
}

# ===== FRIEND Queries =====
query GetFriendsByUser($userId: String!) @auth(level: PUBLIC) {
  friends(where: { userId: { eq: $userId }, status: { eq: "ACCEPTED" } }) {
    userId
    friendUserId
    status
    isQrVerified
    createdAtTimestampMs
  }
}

# ===== VISITED LOG Queries =====
query GetVisitedLogsByUser($userId: String!) @auth(level: PUBLIC) {
  visitedLogs(
    where: { userId: { eq: $userId } }
    orderBy: [{ visitedAtTimestamp: DESC }]
  ) {
    id
    clubId
    clubName
    visitedAtTimestamp
    isVerifiedByGps
  }
}

# ===== BLOCKED USER Queries =====
query GetBlockedUsers($userId: String!) @auth(level: PUBLIC) {
  blockedUsers(where: { userId: { eq: $userId } }) {
    userId
    blockedUserId
    reason
    blockedAtTimestampMs
  }
}
